name: dbt Development CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  dbt-dev:
    runs-on: ubuntu-latest
    environment: development
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write private key to file
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.dbt
            dbt_project/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt_project/packages.yml') }}
          restore-keys: |
            dbt-packages-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake sqlfluff elementary-data pre-commit

      - name: Install dbt packages
        run: |
          cd dbt_project
          dbt deps

      - name: Run dbt parse (validates SQL)
        run: |
          cd dbt_project
          dbt parse

      - name: Run pre-commit checks
        run: |
          pre-commit run --all-files

      - name: Run dbt build (slim CI - only modified)
        if: github.event_name == 'pull_request'
        run: |
          cd dbt_project
          dbt build --select state:modified+ --defer --state target --target dev

      - name: Run dbt build (full on push)
        if: github.event_name == 'push'
        run: |
          cd dbt_project
          dbt build --target dev

      - name: Run dbt test with store_failures
        run: |
          cd dbt_project
          dbt test --store-failures --target dev

      - name: Upload Elementary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elementary-report-dev
          path: dbt_project/target/elementary/
          retention-days: 7

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-dev
          path: dbt_project/target/
          retention-days: 7
