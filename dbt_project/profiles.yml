      role: "{{ env_var('SNOWFLAKE_ROLE', 'OLIST_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'OLIST_LAKEHOUSE_PROD') }}"
      schema: prod
      threads: 16
      client_session_keep_alive: False
      query_tag: eakerian
