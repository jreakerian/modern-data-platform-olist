name: dbt Production Deployment

on:
  push:
    branches: [main]

jobs:
  dbt-prod:
    runs-on: ubuntu-latest
    environment: production
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write private key to file
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake elementary-data

      - name: Install dbt packages
        run: cd dbt_project && dbt deps

      - name: Run dbt build (Prod Target)
        run: |
          cd dbt_project
          dbt build --target prod

      - name: Upload Elementary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elementary-report-prod
          path: dbt_project/target/elementary/
          retention-days: 7

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-prod
          path: dbt_project/target/
          retention-days: 7
